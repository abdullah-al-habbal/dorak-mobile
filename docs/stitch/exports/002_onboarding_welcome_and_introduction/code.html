<style>
        /* Hide nav shell on this transactional/linear splash screen */
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* Animations */
        @keyframes fadeInSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes subtleZoom {
            from {
                transform: scale(1.05);
            }
            to {
                transform: scale(1);
            }
        }

        .animate-fade-in-up {
            animation: fadeInSlideUp 0.8s ease-out forwards;
        }

        .animate-hero-zoom {
            animation: subtleZoom 1.2s ease-out forwards;
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="h-full bg-background flex flex-col justify-between overflow-hidden relative">
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col relative w-full h-full max-w-md mx-auto">
<!-- Hero Image Background -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="bg-cover bg-center w-full h-full opacity-50 animate-hero-zoom" data-alt="A high-end, luxury barbershop interior, bathed in soft, warm lighting. Premium leather barber chairs face large mirrors. The aesthetic is clean, modern corporate with subtle deep purple and dark wood accents. Minimalist and sophisticated, reflecting a high-quality grooming experience." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCGF4isQztiQVOmixEU_h-dx4rIB7OoLNUiyi1EGMzau4c0_z_5P6_scAifcEw5h1TYEItr1PtKYOKaW33goVxPXVGqe0DiiznEOgdEq8eQ8n2c3ZzK7iMh0bcINiEKZlZ3leM_pI58AbJAUjc9VCCFhphV4BYHM84MmDDaoVmX-SEEndm73CwHlAkbtn9Mu-qmO7RurrC9U_aCLBDgSn3cUj3sl7ZMS0OTW0GeXvVZipRhqiJX0xRT')"></div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-background via-background/90 to-background/20"></div>
</div>
<!-- Header with Skip Action -->
<div class="relative z-20 w-full px-margin-mobile pt-12 flex justify-between items-center">
<!-- Brand -->
<div class="flex items-center opacity-0 animate-fade-in-up">
<span class="material-symbols-outlined text-primary text-3xl mr-2" style="font-variation-settings: 'FILL' 1;">spa</span>
<h1 class="font-display-lg text-headline-sm text-primary font-bold tracking-tight">Dorak</h1>
</div>
<!-- Skip Action -->
<button class="text-on-surface-variant font-label-lg px-4 py-2 opacity-0 animate-fade-in-up delay-100 hover:text-primary transition-colors" onclick="document.getElementById('skip-modal').classList.remove('hidden')">
        Skip
    </button>
</div>
<!-- Foreground Content -->
<div class="relative z-10 flex flex-col h-full justify-end p-margin-mobile pb-12">
<!-- Bottom Section: Messaging & Actions -->
<div class="space-y-10 text-center">
<!-- Welcome Messages -->
<div class="space-y-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background opacity-0 animate-fade-in-up delay-200">Your grooming experience, reimagined.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-0 animate-fade-in-up delay-300">Discover top-tier professionals, book with ease, and personalize your style journey.</p>
</div>
<!-- Progress Indicator -->
<div class="flex justify-center space-x-2 py-4 opacity-0 animate-fade-in-up delay-300">
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full border border-outline-variant bg-transparent"></div>
<div class="w-2 h-2 rounded-full border border-outline-variant bg-transparent"></div>
<div class="w-2 h-2 rounded-full border border-outline-variant bg-transparent"></div>
</div>
<!-- Action Buttons -->
<div class="space-y-4 w-full opacity-0 animate-fade-in-up delay-300">
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-4 rounded-full hover:opacity-90 active:scale-95 transition-all shadow-sm">
                        Get Started
                    </button>
</div>
</div>
</div>
</main>
<!-- Skip Bottom Sheet Modal -->
<div class="hidden fixed inset-0 z-50 flex items-end justify-center sm:items-center" id="skip-modal">
<!-- Backdrop -->
<div class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onclick="document.getElementById('skip-modal').classList.add('hidden')"></div>
<!-- Modal Content -->
<div class="relative w-full max-w-md bg-surface rounded-t-3xl sm:rounded-2xl shadow-xl overflow-hidden transform transition-all">
<!-- Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<div class="px-6 pb-8 pt-2">
<h3 class="font-headline-sm text-on-surface mb-6 text-center">Skip Onboarding?</h3>
<div class="space-y-3">
<button class="w-full bg-secondary-container text-on-secondary-container font-label-lg py-3.5 rounded-xl hover:opacity-90 transition-all" onclick="document.getElementById('skip-modal').classList.add('hidden')">
                    Skip for now
                </button>
<button class="w-full bg-surface text-error font-label-lg py-3.5 rounded-xl border border-error/20 hover:bg-error-container/50 transition-all" onclick="document.getElementById('skip-modal').classList.add('hidden')">
                    Don't show again
                </button>
<button class="w-full bg-transparent text-on-surface-variant font-label-lg py-3.5 rounded-xl hover:bg-surface-variant transition-all mt-2" onclick="document.getElementById('skip-modal').classList.add('hidden')">
                    Cancel
                </button>
</div>
</div>
</div>
</div>
</body></html>
