<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dorak - Welcome Back</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
        .fade-slide-up {
            animation: fadeSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        .input-field {
            border-bottom-width: 1px;
            border-bottom-color: #cbc4d2; /* outline-variant */
            background-color: rgba(234, 221, 255, 0.05); /* very light tertiary */
            transition: border-color 0.2s, background-color 0.2s;
        }
        .input-field:focus {
            outline: none;
            border-bottom-color: #4f378a; /* primary */
            background-color: rgba(234, 221, 255, 0.1);
        }
        .input-field.error {
            border-bottom-color: #ba1a1a; /* error */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background h-full flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Header (Back Button only for minimal layout) -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 shrink-0 z-10">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors text-on-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div aria-hidden="true" class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed">
            Dorak
        </div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center max-w-md mx-auto w-full px-margin-mobile md:px-0 relative z-10">
<div class="flex flex-col items-center text-center mb-10 fade-slide-up">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">
                Welcome Back
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Sign in to your account
            </p>
</div>
<form class="flex flex-col gap-6 fade-slide-up delay-100" novalidate="" onsubmit="return false;">
<!-- Email / Phone Field -->
<div class="flex flex-col gap-1 relative">
<input class="input-field w-full px-4 pt-6 pb-2 rounded-t font-body-lg text-body-lg text-on-surface placeholder:text-transparent peer" id="identifier" placeholder="Email or Phone" required="" type="text"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all duration-200 peer-focus:-translate-y-3 peer-focus:scale-75 peer-focus:text-primary peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:scale-75 origin-top-left pointer-events-none" for="identifier">
                    Email or Phone
                </label>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1 relative">
<input class="input-field w-full px-4 pt-6 pb-2 pr-12 rounded-t font-body-lg text-body-lg text-on-surface placeholder:text-transparent peer error" id="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-error transition-all duration-200 peer-focus:-translate-y-3 peer-focus:scale-75 peer-focus:text-error peer-[:not(:placeholder-shown)]:-translate-y-3 peer-[:not(:placeholder-shown)]:scale-75 origin-top-left pointer-events-none" for="password">
                    Password
                </label>
<button aria-label="Toggle password visibility" class="absolute right-3 top-4 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-8 h-8 rounded-full" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
<div class="flex items-center gap-1 mt-1 text-error">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-md text-label-md">Invalid email or password</span>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end fade-slide-up delay-200">
<a class="font-label-lg text-label-lg text-primary hover:text-on-primary-container transition-colors" href="#">
                    Forgot Password?
                </a>
</div>
<!-- Primary CTA -->
<button class="mt-2 w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container transition-colors active:scale-[0.98] fade-slide-up delay-300 relative overflow-hidden group" type="submit">
<span class="relative z-10 flex items-center gap-2">
                    Log In
                    <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</span>
<!-- Loading state overlay (hidden by default, shown via JS typically) -->
<!-- 
                <div class="absolute inset-0 bg-primary-container flex items-center justify-center z-20">
                    <svg class="animate-spin h-5 w-5 text-on-primary-container" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div> 
                -->
</button>
</form>
</main>
<!-- Footer / Tertiary Action -->
<footer class="w-full flex justify-center pb-margin-mobile md:pb-margin-desktop fade-slide-up delay-300 mt-auto pt-8">
<p class="font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-label-lg text-label-lg text-primary ml-1 hover:underline underline-offset-4 decoration-2 decoration-primary-fixed" href="#">
                Create Account
            </a>
</p>
</footer>
<!-- Abstract Decorative Elements (Light Mode) -->
<div aria-hidden="true" class="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[20%] -right-[10%] w-[60vw] h-[60vw] rounded-full bg-primary-fixed opacity-20 blur-3xl mix-blend-multiply"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[70vw] h-[70vw] rounded-full bg-secondary-fixed opacity-30 blur-3xl mix-blend-multiply"></div>
</div>
</body></html>
