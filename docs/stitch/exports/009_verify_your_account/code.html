<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased overflow-hidden">
<!-- TopAppBar (Transactional Screen, simple back button) -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-background">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary">Dorak</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop fade-in-up" style="animation-delay: 0.1s;">
<div class="w-full max-w-[480px] bg-surface/70 backdrop-blur-xl rounded-2xl shadow-[0_8px_32px_rgba(103,80,164,0.1)] border border-white/40 p-8 md:p-12 relative overflow-hidden">
<!-- Subtle background decorative element -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary opacity-10 rounded-full blur-3xl pointer-events-none"></div>
<div class="text-center mb-10 relative z-10">
<span class="material-symbols-outlined text-primary text-5xl mb-4 font-light" style="font-variation-settings: 'FILL' 0;">mark_email_read</span>
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-headline-lg font-medium text-on-surface mb-2">Verify Your Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter the 6-digit code we sent to j***@example.com</p>
</div>
<form class="flex flex-col gap-8 relative z-10">
<!-- OTP Inputs -->
<div class="flex justify-between gap-2 md:gap-4">
<input aria-label="Digit 1" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 2" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 3" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 4" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 5" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
<input aria-label="Digit 6" class="w-12 h-14 md:w-14 md:h-16 text-center font-headline-md text-headline-md border-b-2 border-outline-variant bg-surface-container-low/50 rounded focus:border-primary focus:ring-0 focus:outline-none transition-colors" maxlength="1" type="text"/>
</div>
<!-- Error Message Container (Hidden by default, height preserved to avoid layout shift) -->
<div class="h-6 flex items-center justify-center opacity-0 transition-opacity text-error font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px] mr-1">error</span> Invalid code. Please try again.
                </div>
<!-- CTAs -->
<div class="flex flex-col gap-4 mt-2">
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg h-12 rounded-full hover:bg-opacity-90 transition-all active:scale-[0.98] shadow-sm flex justify-center items-center" type="submit">
                        Verify &amp; Continue
                    </button>
<div class="text-center font-body-md text-body-md text-on-surface-variant flex items-center justify-center gap-1">
                        Didn't receive the code? 
                        <button class="text-primary font-label-md text-label-md hover:underline disabled:text-outline disabled:no-underline" disabled="" type="button">
                            Resend Code (0:59)
                        </button>
</div>
</div>

</main>
<script>
        // Simple auto-advance for OTP inputs
        const inputs = document.querySelectorAll('input[type="text"]');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if(e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if(e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
        
        // Focus first input on load
        if(inputs.length > 0) {
            setTimeout(() => inputs[0].focus(), 500);
        }
    </script>
