<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-x-hidden">
<!-- Global TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16 bg-background docked full-width top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-headline-md text-headline-md font-bold text-primary flex-1 text-center pr-10">Dorak</div>
</header>
<main class="w-full max-w-md mx-auto px-margin-mobile pt-8 pb-16 flex flex-col items-center">
<!-- Step 1: Forgot Password (Initial) -->
<section class="view-step active w-full flex flex-col gap-6 animate-[fadeIn_0.3s_ease-out] animate-[slideUp_0.4s_ease-out]" id="step-forgot"><div class="text-center mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-4">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter the email or phone number associated with your account and we'll help you reset your password.</p>
</div>
<form class="flex flex-col gap-6 w-full" id="forgot-password-form">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="recovery-contact">Email or Phone</label>
<div class="relative">
<input class="w-full h-14 bg-surface-container-lowest border border-outline focus:border-primary focus:ring-2 focus:ring-primary/20 rounded-lg px-4 font-body-lg text-body-lg text-on-surface transition-all" id="recovery-contact" oninput="this.closest('form').querySelector('button[type=submit]').disabled = !this.value;" placeholder="e.g. user@example.com" required="" type="text"/>
</div>
<div class="min-h-[20px]">
<p class="hidden text-error text-xs font-label-md" id="error-message"></p>
</div>
</div>
<div class="flex flex-col gap-4 mt-2">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg rounded-full hover:opacity-90 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2" disabled="" id="submit-btn" type="submit">
<span id="btn-text">Send Code</span>
<span class="material-symbols-outlined animate-spin hidden" id="loading-spinner">progress_activity</span>
</button>
<button class="w-full h-12 bg-transparent text-primary font-label-lg text-label-lg rounded-full hover:bg-surface-variant transition-colors" type="button">Return to Log In</button>
</div>
</form></section>
<!-- Step 2: Verify Your Account (OTP) -->
<!-- Step 3: Create New Password -->
<!-- Step 4: Password Reset Success -->
</main>
<script>
        function showStep(stepId) {
            document.querySelectorAll('.view-step').forEach(el => el.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        // Auto-advance OTP inputs
        const otpInputs = document.querySelectorAll('#step-verify input[type="text"]');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
